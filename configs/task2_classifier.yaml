# Task 2 (part A) — corruption classifier: 0 clean, 1 salt-and-pepper, 2 blur, 3 occlusion
base:
  seed: 42
  device: auto
  progress: true
  data:
    num_workers: 4
    limit_data: null
  model:
    base_channels: 32
    channel_mults: [1, 2, 4, 8]
    dropout: 0.3
    num_classes: 4
  train:
    epochs: 40
    batch_size: 64            # must be a multiple of 4 (balanced batches)
    lr: 1.0e-3
    weight_decay: 1.0e-4
    amp: true
    scheduler: cosine
    early_stopping_patience: 10
  optuna:
    study_name: task2_classifier
    storage: sqlite:///optuna_studies/task2_classifier.db
    n_trials: 25
    epochs: 10
    pruner: median
    pruner_startup_trials: 4
    pruner_warmup_steps: 3
    seed: 42
    search_space:
      lr:            {type: float, low: 1.0e-4, high: 3.0e-3, log: true, target: train.lr}
      batch_size:    {type: categorical, choices: [32, 64, 128], target: train.batch_size}
      base_channels: {type: categorical, choices: [16, 32, 48], target: model.base_channels}
      channel_plan:  {type: categorical, choices: [shallow, standard, wide_top], target: model.channel_mults,
                      map: {shallow: [1, 2, 4], standard: [1, 2, 4, 8], wide_top: [1, 2, 4, 8, 8]}}
      dropout:       {type: float, low: 0.0, high: 0.5, target: model.dropout}
      weight_decay:  {type: float, low: 1.0e-6, high: 1.0e-2, log: true, target: train.weight_decay}
  tracking:
    enabled: true
    experiment: task2-classifier
  output:
    checkpoint: checkpoints/task2/classifier.pt
    dir: outputs/task2/classifier
    optuna_dir: outputs/task2/classifier/optuna

modes:
  smoke:
    progress: false
    data: {limit_data: 48, num_workers: 0}
    train: {epochs: 1, batch_size: 16}
    optuna: {n_trials: 2, epochs: 1, study_name: task2_classifier_smoke, storage: sqlite:///optuna_studies/smoke.db,
             search_space: {batch_size: {type: categorical, choices: [16], target: train.batch_size}}}
    tracking: {experiment: smoke-tests}
    output:
      checkpoint: checkpoints/smoke/classifier.pt
      dir: outputs/smoke/task2/classifier
      optuna_dir: outputs/smoke/task2/classifier/optuna
  dev:
    train: {epochs: 15}
    optuna: {n_trials: 10, epochs: 5}
  final:
    train: {epochs: 40}
    optuna: {n_trials: 25, epochs: 10}
