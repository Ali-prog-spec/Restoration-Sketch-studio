# Task 1 — Universal multi-corruption denoising autoencoder
base:
  seed: 42
  device: auto
  progress: true
  data:
    num_workers: 4
    limit_data: null          # N images per split (smoke tests)
    balanced_batches: true    # exactly B/4 of each condition per batch
  model:
    base_channels: 32
    channel_mults: [1, 2, 4, 8]   # encoder channels = base * mults; 128 -> 64 -> 32 -> 16 -> 8
    latent_channels: 16           # bottleneck = 16 x 8 x 8 = 1024 values (48x compression)
    dropout: 0.1
    skip_levels: []               # NO skip connections (genuine bottleneck). Ablation: [0]
    skip_channels: 4
  loss:
    alpha: 0.8                    # initial value from the PDF; tuned by Optuna
  train:
    epochs: 60
    batch_size: 32
    lr: 1.0e-3
    weight_decay: 0.0
    amp: true
    scheduler: cosine
    early_stopping_patience: 12
  optuna:
    study_name: task1_universal_dae
    storage: sqlite:///optuna_studies/task1.db
    n_trials: 30
    epochs: 15                    # shortened schedule per trial
    pruner: median
    pruner_startup_trials: 4
    pruner_warmup_steps: 3
    seed: 42
    search_space:
      lr:              {type: float, low: 1.0e-4, high: 3.0e-3, log: true, target: train.lr}
      batch_size:      {type: categorical, choices: [16, 32, 64], target: train.batch_size}
      bottleneck:      {type: categorical, choices: [8x8x16, 8x8x32, 8x8x64, 16x16x8, 16x16x16],
                        # grid x grid x latent channels; every option compresses the 49,152-value input >= 12x
                        map: {8x8x16:   {model.channel_mults: [1, 2, 4, 8], model.latent_channels: 16},
                              8x8x32:   {model.channel_mults: [1, 2, 4, 8], model.latent_channels: 32},
                              8x8x64:   {model.channel_mults: [1, 2, 4, 8], model.latent_channels: 64},
                              16x16x8:  {model.channel_mults: [1, 2, 4],    model.latent_channels: 8},
                              16x16x16: {model.channel_mults: [1, 2, 4],    model.latent_channels: 16}}}
      base_channels:   {type: categorical, choices: [16, 32, 48], target: model.base_channels}
      dropout:         {type: float, low: 0.0, high: 0.3, target: model.dropout}
      alpha:           {type: float, low: 0.5, high: 0.95, target: loss.alpha}
  tracking:
    enabled: true
    experiment: task1-universal-dae
  output:
    checkpoint: checkpoints/task1/universal_dae.pt
    dir: outputs/task1
    optuna_dir: outputs/task1/optuna

modes:
  smoke:
    progress: false
    data: {limit_data: 48, num_workers: 0}
    train: {epochs: 1, batch_size: 16}
    optuna: {n_trials: 2, epochs: 1, study_name: task1_smoke, storage: sqlite:///optuna_studies/smoke.db,
             search_space: {batch_size: {type: categorical, choices: [16], target: train.batch_size}}}
    tracking: {experiment: smoke-tests}
    output:
      checkpoint: checkpoints/smoke/task1.pt
      dir: outputs/smoke/task1
      optuna_dir: outputs/smoke/task1/optuna
  dev:
    train: {epochs: 20}
    optuna: {n_trials: 10, epochs: 8}
  final:
    train: {epochs: 80, early_stopping_patience: 15}
    optuna: {n_trials: 30, epochs: 15}
